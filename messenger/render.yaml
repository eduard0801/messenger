services:
  - type: web
    name: messenger
    env: node
    plan: free
    buildCommand: cd messenger/frontend && npm install && npm run build && cd ../backend && npm install
    startCommand: cd messenger/backend && NODE_ENV=production node server.js
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
